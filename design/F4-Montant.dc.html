<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bon · 3 Montant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#0F2A20;font-family:Inter,system-ui,sans-serif;color:#fff;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:40px 20px 28px;display:flex;flex-direction:column;justify-content:space-between">

  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;height:44px">
      <a href="F3-Scan.dc.html" aria-label="Retour au scan" style="width:44px;height:44px;border-radius:100px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      </a>
      <div style="padding:7px 14px;border-radius:100px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600">Étape 3 sur 3</div>
      <div aria-hidden="true" style="width:44px"></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:100px;background:rgba(255,255,255,.08)">
      <div style="width:34px;height:34px;border-radius:100px;background:#FAFAF7;color:#1B4332;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10M3 9.5 4.8 4h14.4L21 9.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0ZM9.5 20v-5h5v5"></path></svg>
      </div>
      <div style="font-size:13.5px;font-weight:600">Boutique Ndiaye <span style="font-weight:400;color:rgba(255,255,255,.78)">· vérifiée</span></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px">
      <div style="font-size:13.5px;color:rgba(255,255,255,.78)">Montant du bon</div>
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="font-size:64px;font-weight:700;letter-spacing:-.045em;line-height:1">2&#8239;500</div>
        <div style="font-size:13px;font-weight:700;letter-spacing:.08em;color:#F4A100;padding-top:8px">FCFA</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:rgba(82,183,136,.18);color:#B7E4C7;font-size:13px;font-weight:600">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.2"><path d="M5 12.5 9.5 17 19 7.5"></path></svg>
        Il restera 5&#8239;000 FCFA avant le plafond
      </div>
    </div>

    <div style="display:flex;gap:8px;padding-top:4px">
      <button type="button" style="height:44px;padding:0 18px;border-radius:100px;background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600">1&#8239;000</button>
      <button type="button" aria-pressed="true" style="height:44px;padding:0 18px;border-radius:100px;background:#FAFAF7;color:#0F2A20;font-size:13.5px;font-weight:700">2&#8239;500</button>
      <button type="button" style="height:44px;padding:0 18px;border-radius:100px;background:rgba(255,255,255,.08);font-size:13.5px;font-weight:600">5&#8239;000</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="12">
        <button type="button" aria-label="{{ k.aria }}" style="height:58px;border-radius:18px;background:rgba(255,255,255,.07);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center">
          <sc-if value="{{ k.txt }}" hint-placeholder-val="{{ true }}">{{ k.label }}</sc-if>
          <sc-if value="{{ k.del }}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5h10a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9L3 12l6-6.5ZM12 9.5l5 5M17 9.5l-5 5"></path></svg></sc-if>
        </button>
      </sc-for>
    </div>

    <a href="F5-Bon-note.dc.html" aria-label="Glisser pour noter le bon de 2 500 FCFA" style="position:relative;height:64px;border-radius:100px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.88)">
      <span aria-hidden="true" style="position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:100px;background:#F4A100;color:#0F2A20;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </span>
      Glisser pour noter le bon
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "000", "0"].map((d) => ({ label: d, aria: d, txt: true, del: false }));
    keys.push({ label: "", aria: "Effacer", txt: false, del: true });
    return { keys: keys };
  }
}
</script>
</body>
</html>
