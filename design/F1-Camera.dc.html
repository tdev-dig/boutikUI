<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bon · 1 Photo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#0B1A14;font-family:Inter,system-ui,sans-serif;color:#fff;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:40px 20px 34px;display:flex;flex-direction:column;gap:16px">

  <div style="display:flex;align-items:center;justify-content:space-between;height:44px;flex:none">
    <a href="C1-Accueil.dc.html" aria-label="Annuler" style="width:44px;height:44px;border-radius:100px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div style="padding:7px 14px;border-radius:100px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600">Étape 1 sur 3</div>
    <button type="button" aria-label="Flash" aria-pressed="{{ flash }}" onClick="{{ toggleFlash }}" style="width:44px;height:44px;border-radius:100px;background:{{ flashBg }};color:{{ flashFg }};display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6l1-7.5Z"></path></svg>
    </button>
  </div>

  <div style="font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;text-align:center;flex:none">Prends en photo ce que tu emportes</div>

  <div style="position:relative;flex:1;min-height:0;border-radius:28px;background:#15251E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.66)">
    <div aria-hidden="true" style="position:absolute;left:18px;top:18px;width:30px;height:30px;border-left:3px solid #FAFAF7;border-top:3px solid #FAFAF7;border-radius:10px 0 0 0"></div>
    <div aria-hidden="true" style="position:absolute;right:18px;top:18px;width:30px;height:30px;border-right:3px solid #FAFAF7;border-top:3px solid #FAFAF7;border-radius:0 10px 0 0"></div>
    <div aria-hidden="true" style="position:absolute;left:18px;bottom:18px;width:30px;height:30px;border-left:3px solid #FAFAF7;border-bottom:3px solid #FAFAF7;border-radius:0 0 0 10px"></div>
    <div aria-hidden="true" style="position:absolute;right:18px;bottom:18px;width:30px;height:30px;border-right:3px solid #FAFAF7;border-bottom:3px solid #FAFAF7;border-radius:0 0 10px 0"></div>
    <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:1.4"><path d="M4 8h3l1.7-2.5h6.6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1ZM12 17.2a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"></path></svg>
    <div style="font-size:13px">Image de la caméra</div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:0 18px;flex:none">
    <div aria-hidden="true" style="width:48px"></div>
    <a href="F2-Apercu.dc.html" aria-label="Prendre la photo" style="width:80px;height:80px;border-radius:100px;border:4px solid #FAFAF7;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
      <span aria-hidden="true" style="width:62px;height:62px;border-radius:100px;background:#FAFAF7"></span>
    </a>
    <button type="button" aria-label="Changer de caméra" aria-pressed="{{ front }}" onClick="{{ flip }}" style="width:48px;height:48px;border-radius:100px;background:{{ flipBg }};color:{{ flipFg }};display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1L19.5 9M19.5 4.5V9H15M19.5 12a7.5 7.5 0 0 1-13 5.1L4.5 15M4.5 19.5V15H9"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { flash: false, front: false }; }
  renderVals() {
    const s = this.state;
    return {
      flash: s.flash, toggleFlash: () => this.setState({ flash: !s.flash }), flashBg: s.flash ? "#F4A100" : "rgba(255,255,255,.1)", flashFg: s.flash ? "#0F2A20" : "#fff",
      front: s.front, flip: () => this.setState({ front: !s.front }), flipBg: s.front ? "#FAFAF7" : "rgba(255,255,255,.1)", flipFg: s.front ? "#0F2A20" : "#fff"
    };
  }
}
</script>
</body>
</html>
