<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>QR de la boutique</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FFFFFF;font-family:Inter,system-ui,sans-serif;color:#1A1A1A;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:40px 20px 28px;display:flex;flex-direction:column;justify-content:space-between">

  <div style="display:flex;flex-direction:column;align-items:center;gap:22px">
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%;height:44px">
      <a href="Main.dc.html" aria-label="Fermer" style="width:44px;height:44px;border-radius:100px;background:#F2F2EF;display:flex;align-items:center;justify-content:center;color:#1B4332">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
      <div style="font-size:16px;font-weight:700">QR de la boutique</div>
      <div aria-hidden="true" style="width:44px"></div>
    </div>

    <div style="padding:22px;border-radius:28px;border:1.5px solid rgba(27,67,50,.16);margin-top:8px">
      <div role="img" aria-label="QR code de Boutique Ndiaye" style="display:grid;grid-template-columns:repeat(25, minmax(0, 1fr));width:250px;height:250px">
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="25">
          <div style="background:{{ c.bg }}"></div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
      <div style="font-size:24px;font-weight:700;letter-spacing:-.025em">Boutique Ndiaye</div>
      <div style="font-size:14px;color:#5F5F5A">Sacré-Cœur 3, Dakar</div>
      <div style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;background:rgba(45,106,79,.14);color:#1F5A40;font-size:12.5px;font-weight:700;margin-top:2px">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2"><path d="M12 3l7 3v5.5c0 4.3-2.9 7.8-7 9.5-4.1-1.700-7-5.200-7-9.500V6l7-3ZM9 12l2.200 2.200L15.500 10"></path></svg>
        Boutique vérifiée
      </div>
    </div>

    <div style="font-size:14px;line-height:1.45;color:#3D3D39;text-align:center;max-width:290px">Le client scanne ce code pour noter un bon dans son cahier.</div>
  </div>

  <div style="display:flex;gap:10px">
    <button type="button" style="flex:1;height:56px;border-radius:18px;border:1.5px solid rgba(27,67,50,.22);box-sizing:border-box;color:#1B4332;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11.5l4 4 4-4M5 20h14"></path></svg>Télécharger
    </button>
    <button type="button" style="flex:1;height:56px;border-radius:18px;background:#1B4332;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 7.5l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"></path></svg>Partager
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 25, seed = 7;
    const finders = [[0, 0], [0, N - 7], [N - 7, 0]];
    function on(r, c) {
      for (let i = 0; i < finders.length; i++) {
        const y = r - finders[i][0], x = c - finders[i][1];
        if (y >= -1 && y <= 7 && x >= -1 && x <= 7) {
          if (y < 0 || y > 6 || x < 0 || x > 6) return false;
          return y === 0 || y === 6 || x === 0 || x === 6 || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
        }
      }
      if (r === 6 || c === 6) return (r + c) % 2 === 0;
      const d = Math.max(Math.abs(r - (N - 7)), Math.abs(c - (N - 7)));
      if (d <= 2) return d !== 1;
      const h = Math.sin(r * 12.9898 + c * 78.233 + seed) * 43758.5453;
      return h - Math.floor(h) > 0.5;
    }
    const cells = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) cells.push({ bg: on(r, c) ? "#0F2A20" : "transparent" });
    return { cells: cells };
  }
}
</script>
</body>
</html>
