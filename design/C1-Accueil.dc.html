<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAFAF7;font-family:Inter,system-ui,sans-serif;color:#1A1A1A;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased">

  <div style="background:#1B4332;border-radius:0 0 32px 32px;padding:40px 20px 22px;color:#fff;display:flex;flex-direction:column;gap:18px">

      <button type="button" aria-label="{{ amtAria }}" aria-pressed="{{ hidden }}" onClick="{{ toggleAmt }}" style="margin-top:2px;align-self:flex-start;display:flex;align-items:flex-start;gap:7px;text-align:left">
        <span style="font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1">{{ amt }}</span>

    </div>
    <sc-for list="{{ cahiers }}" as="c" hint-placeholder-count="3">
      <a href="{{ c.href }}" style="display:flex;align-items:center;gap:12px;height:70px;border-top:1px solid rgba(27,67,50,.09)">
        <div style="width:44px;height:44px;border-radius:14px;background:#F2F2EF;color:#1B4332;display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10M3 9.5 4.8 4h14.4L21 9.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0ZM9.5 20v-5h5v5"></path></svg>
        </div>
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:15px;font-weight:600">{{ c.name }}</div>
          <div style="font-size:12.5px;color:#5F5F5A;margin-top:3px">{{ c.sub }}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none">
          <div style="font-size:15px;font-weight:700">{{ c.amount }}</div>
          <div style="padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:700;background:{{ c.bg }};color:{{ c.fg }}">{{ c.status }}</div>
        </div>
      </a>
    </sc-for>

    <div style="font-size:16px;font-weight:700;letter-spacing:-.01em;height:40px;display:flex;align-items:flex-end;padding-bottom:6px;box-sizing:border-box;border-top:1px solid rgba(27,67,50,.09)">Mes derniers bons</div>
    <div style="display:flex;align-items:center;gap:12px;height:64px">
      <div style="width:44px;height:44px;border-radius:14px;background:#F2F2EF;color:#1B4332;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.7-2.5h6.6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1ZM12 17.2a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8Z"></path></svg>

      </div>
      <div style="font-size:15px;font-weight:700">+2&#8239;500</div>
    </div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:22px;display:flex;align-items:center;gap:10px">
    <nav aria-label="Menu principal" style="flex-grow:1;height:62px;box-sizing:border-box;padding:6px;border-radius:100px;background:#0F2A20;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 26px rgba(15,42,32,.28)">
      <a href="C1-Accueil.dc.html" aria-current="page" style="height:50px;padding:0 14px 0 12px;border-radius:100px;background:#FAFAF7;color:#0F2A20;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>Accueil
      </a>
      <a href="C2-Famille.dc.html" aria-label="Famille" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM2.5 20c.5-3.4 3-5.5 6.5-5.5s6 2.1 6.5 5.5M16.5 4.4a3.5 3.5 0 0 1 0 6.2M18 14.9c2 .7 3.2 2.4 3.5 5.1"></path></svg>
      </a>
      <a href="C3-Cahiers.dc.html" aria-label="Cahiers" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h15A1.5 1.5 0 0 1 21 11v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19v-8a1.5 1.5 0 0 1 1.5-1.5ZM5.5 6.5h13M8 3.5h8"></path></svg>
      </a>
      <a href="C4-Profil.dc.html" aria-label="Profil" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20.5c.8-3.9 3.6-6 7.5-6s6.7 2.1 7.5 6"></path></svg>
      </a>
    </nav>
    <a href="F1-Camera.dc.html" aria-label="Noter un bon" style="width:62px;height:62px;border-radius:100px;background:#F4A100;color:#0F2A20;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 12px 24px rgba(244,161,0,.34)">

    </a>
  </div>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position:absolute;left:20px;right:20px;bottom:100px;padding:13px 16px;border-radius:16px;background:#0F2A20;color:#fff;font-size:14px;font-weight:600;line-height:1.35;text-align:center;box-shadow:0 14px 30px rgba(6,22,16,.35)">{{ toast }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: "", hidden: false }; }
  say(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: "" }), 2600); }
  componentWillUnmount() { clearTimeout(this.tt); }
  renderVals() {
    const s = this.state;
    return {
      toast: s.toast, notif: () => this.say("Dernière alerte : ton cahier chez Alimentation Sow est bloqué"),
      hidden: s.hidden, toggleAmt: () => this.setState({ hidden: !s.hidden }),
      amt: s.hidden ? "•• •••" : "33 500", amtAria: s.hidden ? "Afficher le montant" : "Masquer le montant, 33 500 FCFA",
      cahiers: [
        { name: "Boutique Ndiaye", sub: "Échéance le 30 nov.", amount: "12 500", status: "Actif", bg: "rgba(45,106,79,.14)", fg: "#1F5A40", href: "C3-Cahiers.dc.html" },
        { name: "Alimentation Sow", sub: "Échu le 10 nov. · à rembourser", amount: "18 000", status: "Bloqué", bg: "#C1121F", fg: "#FFFFFF", href: "C5-Cahier-bloque.dc.html" },
        { name: "Boutique Fall", sub: "Ouverture demandée ce matin", amount: "3 000", status: "En attente", bg: "rgba(244,161,0,.2)", fg: "#7A4F00", href: "F7-Premier-bon.dc.html" }
      ]
    };
  }
}
</script>
