<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Boutiquier · Vendeurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAFAF7;font-family:Inter,system-ui,sans-serif;color:#1A1A1A;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased">

  <div style="background:#1B4332;border-radius:0 0 32px 32px;padding:40px 20px 22px;color:#fff;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="font-size:26px;font-weight:700;letter-spacing:-.025em">Vendeurs</div>
      <a href="B15-Inviter-vendeur.dc.html" aria-label="Inviter un vendeur" style="width:44px;height:44px;border-radius:100px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center">
        <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>

    <div style="display:flex;padding:4px;border-radius:100px;background:rgba(255,255,255,.12)">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button type="button" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="flex:1;height:44px;border-radius:100px;background:{{ t.bg }};color:{{ t.fg }};font-size:13.5px;font-weight:{{ t.fw }}">{{ t.label }}</button>
      </sc-for>
    </div>

    <div style="display:flex;gap:16px;padding-top:2px">
      <a href="B15-Inviter-vendeur.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:7px;width:62px">
        <span style="width:56px;height:56px;border-radius:100px;border:1.5px dashed rgba(255,255,255,.5);box-sizing:border-box;display:flex;align-items:center;justify-content:center">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </span>
        <span style="font-size:12.5px;color:rgba(255,255,255,.82)">Inviter</span>
      </a>
      <a href="B16-Detail-vendeur.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:7px;width:62px">
        <span style="position:relative;width:56px;height:56px;border-radius:100px;background:#FAFAF7;color:#1B4332;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">IS<span aria-hidden="true" style="position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:100px;background:#52B788;border:2.500px solid #1B4332"></span></span>
        <span style="font-size:12.5px;font-weight:600">Ibrahima</span>
      </a>
      <a href="B16-Detail-vendeur.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:7px;width:62px">
        <span style="position:relative;width:56px;height:56px;border-radius:100px;background:#FAFAF7;color:#1B4332;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">CD<span aria-hidden="true" style="position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:100px;background:#52B788;border:2.500px solid #1B4332"></span></span>
        <span style="font-size:12.5px;font-weight:600">Cheikh</span>
      </a>
      <a href="B16-Detail-vendeur.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:7px;width:62px">
        <span style="width:56px;height:56px;border-radius:100px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700">MG</span>
        <span style="font-size:12.5px;line-height:1.25;text-align:center;color:rgba(255,255,255,.82)">Mame<br>invitée</span>
      </a>
    </div>
  </div>

  <div style="padding:18px 20px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
      <div style="padding:14px 16px;border-radius:20px;background:#fff;box-shadow:0 1px 0 rgba(27,67,50,.08)">
        <div style="font-size:12.5px;color:#5F5F5A">Bons de l'équipe</div>
        <div style="font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px">{{ count }}</div>
      </div>
      <div style="padding:14px 16px;border-radius:20px;background:#fff;box-shadow:0 1px 0 rgba(27,67,50,.08)">
        <div style="font-size:12.5px;color:#5F5F5A">Montant noté</div>
        <div style="display:flex;align-items:flex-start;gap:5px;margin-top:6px">
          <div style="font-size:26px;font-weight:700;letter-spacing:-.03em">{{ total }}</div>
          <div style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#8A5A00;padding-top:5px">FCFA</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:#F2F2EF">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="color:#1B4332"><path d="M12 3l7 3v5.500c0 4.300-2.900 7.800-7 9.500-4.100-1.700-7-5.200-7-9.500V6l7-3ZM9 12l2.200 2.200L15.500 10"></path></svg>
      <div style="font-size:13px;line-height:1.4;color:#3D3D39">Un vendeur voit les cahiers et note des bons. Il n'encaisse pas et n'ouvre pas de cahier.</div>
    </div>

    <div>
      <div style="font-size:16px;font-weight:700;letter-spacing:-.01em;height:34px;display:flex;align-items:center">Activité de l'équipe</div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:12px;height:64px;border-top:1px solid rgba(27,67,50,.09)">
          <div style="width:44px;height:44px;border-radius:100px;background:#F2F2EF;color:#1B4332;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;flex:none">{{ r.ini }}</div>
          <div style="flex-grow:1;min-width:0">
            <div style="font-size:15px;font-weight:600">{{ r.name }}</div>
            <div style="font-size:12.5px;color:#5F5F5A;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.meta }}</div>
          </div>
          <div style="font-size:15px;font-weight:700">{{ r.amount }}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:22px;display:flex;align-items:center;gap:10px">
    <nav aria-label="Menu principal" style="flex-grow:1;height:62px;box-sizing:border-box;padding:6px;border-radius:100px;background:#0F2A20;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 26px rgba(15,42,32,.28)">
      <a href="Main.dc.html" aria-label="Accueil" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.500v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>
      </a>
      <a href="B2-Vendeurs.dc.html" aria-current="page" style="height:50px;padding:0 14px 0 12px;border-radius:100px;background:#FAFAF7;color:#0F2A20;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.500 3.500 0 1 0 0-7 3.500 3.500 0 0 0 0 7ZM2.500 20c.5-3.400 3-5.500 6.500-5.500s6 2.100 6.500 5.500M16.500 4.400a3.500 3.500 0 0 1 0 6.200M18 14.900c2 .7 3.200 2.400 3.500 5.100"></path></svg>Vendeurs
      </a>
      <a href="B3-Cahiers.dc.html" aria-label="Cahiers" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.500 9.500h15A1.500 1.500 0 0 1 21 11v8a1.500 1.500 0 0 1-1.500 1.500h-15A1.500 1.500 0 0 1 3 19v-8a1.500 1.500 0 0 1 1.500-1.500ZM5.500 6.500h13M8 3.500h8"></path></svg>
      </a>
      <a href="B4-Profil.dc.html" aria-label="Profil" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.500 20.500c.8-3.900 3.600-6 7.500-6s6.700 2.100 7.500 6"></path></svg>
      </a>
    </nav>
    <a href="F1-Camera.dc.html" aria-label="Noter un bon" style="width:62px;height:62px;border-radius:100px;background:#F4A100;color:#0F2A20;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 12px 24px rgba(244,161,0,.34)">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.500h12V21l-3-1.800-3 1.800-3-1.800L6 21V3.500ZM12 8v6M9 11h6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { period: "mois" }; }
  renderVals() {
    const p = this.state.period;
    const tab = (id, label) => {
      const on = p === id;
      return { label: label, on: on, pick: () => this.setState({ period: id }), bg: on ? "#FAFAF7" : "transparent", fg: on ? "#0F2A20" : "rgba(255,255,255,.82)", fw: on ? 700 : 600 };
    };
    const all = [
        { ini: "IS", name: "Ibrahima Sarr", meta: "08:47 · pour Malick Kane", amount: "+5 000" },
        { ini: "CD", name: "Cheikh Diallo", meta: "07:44 · pour Malick Kane", amount: "+1 200" },
        { ini: "IS", name: "Ibrahima Sarr", meta: "Mardi 18:22 · pour Aïssatou Diop", amount: "+4 000" },
        { ini: "CD", name: "Cheikh Diallo", meta: "Mardi 11:30 · pour Ndèye Bâ", amount: "+2 400" }
    ];
    // Les deux premières lignes datent d'aujourd'hui.
    return {
      tabs: [tab("jour", "Aujourd'hui"), tab("mois", "Ce mois")],
      count: p === "jour" ? "2" : "55", total: p === "jour" ? "6 200" : "202 700",
      rows: p === "jour" ? all.slice(0, 2) : all
    };
  }
}
</script>
</body>
</html>
