<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: "", rappels: true }; }
  say(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: "" }), 3200); }
  componentWillUnmount() { clearTimeout(this.tt); }
  renderVals() {
    return {
      toast: this.state.toast,
      info: (e) => {
        const t = e.currentTarget.textContent || "";
        if (t.indexOf("Payer") >= 0) this.say("Tu choisis Wave ou Orange Money au moment de rembourser.");
        else if (t.indexOf("Rappels") >= 0) { const on = !this.state.rappels; this.setState({ rappels: on }); this.say(on ? "Rappels activés avant chaque échéance." : "Rappels coupés. Tu peux les remettre ici."); }
        else this.say("L'aide arrive bientôt dans l'app.");
      }
    };
  }
}
</script>
