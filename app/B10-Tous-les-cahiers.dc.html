<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tous les cahiers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
input::placeholder{color:#5F5F5A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAFAF7;font-family:Inter,system-ui,sans-serif;color:#1A1A1A;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:40px 20px 0;display:flex;flex-direction:column;gap:12px">

  <div style="display:flex;flex:none;align-items:center;gap:12px;height:44px">
    <a href="B3-Cahiers.dc.html" aria-label="Retour à la pile" style="width:44px;height:44px;border-radius:100px;background:#F2F2EF;display:flex;align-items:center;justify-content:center;color:#1B4332;flex:none">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="font-size:22px;font-weight:700;letter-spacing:-.02em">Tous les cahiers</div>
  </div>

  <label style="display:flex;flex:none;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:#F2F2EF;color:#5F5F5A">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"></path></svg>
    <input type="search" value="{{ q }}" onChange="{{ onSearch }}" placeholder="Rechercher un client" aria-label="Rechercher un client" style="flex-grow:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:15px;color:#1A1A1A">
  </label>

  <div style="display:flex;gap:5px;flex:none">
    <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="height:44px;padding:0 10px;border-radius:100px;background:{{ f.bg }};color:{{ f.fg }};font-size:13px;font-weight:{{ f.fw }};white-space:nowrap">{{ f.label }}</button>
    </sc-for>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;padding-bottom:20px">
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="padding:28px 0;text-align:center;font-size:14px;color:#5F5F5A;border-top:1px solid rgba(27,67,50,.09)">Aucun cahier ne correspond.</div>
    </sc-if>
    <sc-for list="{{ cahiers }}" as="c" hint-placeholder-count="8">
      <a href="{{ c.href }}" style="display:flex;align-items:center;gap:12px;height:72px;border-top:1px solid rgba(27,67,50,.09)">
        <div style="width:46px;height:46px;border-radius:100px;background:#F2F2EF;color:#1B4332;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none">{{ c.ini }}</div>
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:15px;font-weight:600">{{ c.name }}</div>
          <div style="font-size:12.5px;color:#5F5F5A;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.sub }}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none">
          <div style="font-size:15px;font-weight:700">{{ c.amount }}</div>
          <div style="padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:700;background:{{ c.bg }};color:{{ c.fg }}">{{ c.status }}</div>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: "", q: "" }; }
  renderVals() {
    const ok = { status: "Actif", bg: "rgba(45,106,79,.14)", fg: "#1F5A40", href: "B3-Cahiers.dc.html" };
    const rows = [
      Object.assign({ ini: "AD", name: "Aïssatou Diop", sub: "Échéance le 30 nov.", amount: "12 500" }, ok),
      { ini: "FS", name: "Fatou Sow", sub: "Échu le 10 nov. · plafond atteint", amount: "18 000", status: "Bloqué", bg: "#C1121F", fg: "#FFFFFF", href: "B6-Cahier-bloque.dc.html" },
      { ini: "OF", name: "Ousmane Fall", sub: "Ouverture demandée ce matin", amount: "3 000", status: "En attente", bg: "rgba(244,161,0,.2)", fg: "#7A4F00", href: "B11-Demande-ouverture.dc.html" },
      Object.assign({ ini: "MK", name: "Malick Kane", sub: "Sans plafond ni échéance", amount: "7 500" }, ok),
      Object.assign({ ini: "CF", name: "Coumba Faye", sub: "Échéance le 20 nov.", amount: "9 800" }, ok),
      Object.assign({ ini: "MS", name: "Mamadou Sy", sub: "Échéance le 5 déc.", amount: "21 000" }, ok),
      Object.assign({ ini: "AM", name: "Abdou Mbaye", sub: "Plafond presque atteint", amount: "14 200" }, ok),
      Object.assign({ ini: "RN", name: "Rokhaya Ndour", sub: "Échéance le 28 nov.", amount: "6 300" }, ok),
      Object.assign({ ini: "PG", name: "Pape Gueye", sub: "Sans échéance", amount: "2 900" }, ok)
    ];
    const more = [["NB", "Ndèye Bâ", "Échéance le 25 nov.", "5 400"], ["AT", "Awa Thiam", "Sans échéance", "4 000"], ["LN", "Lamine Ndour", "Échéance le 2 déc.", "6 200"], ["BC", "Binta Camara", "Échéance le 18 nov.", "3 500"], ["SG", "Seynabou Gaye", "Sans plafond ni échéance", "2 700"], ["MD", "Modou Diagne", "Échéance le 30 nov.", "4 500"], ["AS", "Aminata Seck", "Échéance le 22 nov.", "2 000"]];
    more.forEach((m) => rows.push(Object.assign({ ini: m[0], name: m[1], sub: m[2], amount: m[3] }, ok)));
    rows.splice(3, 0, { ini: "AD", name: "Assane Diouf", sub: "Échu le 8 nov.", amount: "8 000", status: "Bloqué", bg: "#C1121F", fg: "#FFFFFF", href: "B6-Cahier-bloque.dc.html" });
    const s = this.state, norm = (t) => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const count = (st) => rows.filter((r) => !st || r.status === st).length;
    const filter = (id, label) => {
      const on = s.f === id;
      return { label: label + " " + count(id), on: on, pick: () => this.setState({ f: id }), bg: on ? "#1B4332" : "#F2F2EF", fg: on ? "#fff" : "#1A1A1A", fw: on ? 700 : 600 };
    };
    const shown = rows.filter((r) => (!s.f || r.status === s.f) && norm(r.name).indexOf(norm(s.q.trim())) >= 0);
    return {
      cahiers: shown, empty: shown.length === 0, q: s.q, onSearch: (e) => this.setState({ q: e.target.value }),
      filters: [filter("", "Tous"), filter("Actif", "Actifs"), filter("Bloqué", "Bloqués"), filter("En attente", "En attente")]
    };
  }
}
</script>
</body>
</html>
