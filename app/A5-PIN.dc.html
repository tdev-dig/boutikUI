<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code secret</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes bk-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){[data-anim]{animation:none!important}}
</style>
</helmet>
<div onKeyDown="{{ onKey }}" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAFAF7;font-family:Inter,system-ui,sans-serif;color:#1A1A1A;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding:40px 20px 28px;display:flex;flex-direction:column;justify-content:space-between">

  <div style="display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <a href="A4-OTP.dc.html" aria-label="Retour" style="width:44px;height:44px;border-radius:100px;background:#F2F2EF;display:flex;align-items:center;justify-content:center;color:#1B4332">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      </a>
      <div style="padding:7px 14px;border-radius:100px;background:#F2F2EF;font-size:13px;font-weight:600;color:#3D3D39">Étape 3 sur 4</div>
      <div aria-hidden="true" style="width:44px"></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:10px">
      <div aria-hidden="true" style="width:64px;height:64px;border-radius:22px;background:{{ tileBg }};color:{{ tileFg }};display:flex;align-items:center;justify-content:center">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1ZM8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      </div>
      <div style="font-size:28px;font-weight:700;letter-spacing:-.03em">{{ title }}</div>
      <sc-if value="{{ calm }}" hint-placeholder-val="{{ true }}">
        <div style="font-size:15px;line-height:1.45;color:#3D3D39;max-width:300px">{{ sub }}</div>
      </sc-if>
      <sc-if value="{{ err }}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="font-size:15px;line-height:1.45;font-weight:600;color:#A50F1A;max-width:300px">Les deux codes ne sont pas identiques. Recommence.</div>
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px">
      <div role="img" aria-label="{{ dotsAria }}" data-anim style="display:flex;justify-content:center;gap:20px;height:48px;align-items:center;animation:{{ shake }}">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
          <span style="width:20px;height:20px;border-radius:100px;box-sizing:border-box;background:{{ d.bg }};border:2px solid {{ d.bd }}"></span>
        </sc-for>
      </div>
      <sc-if value="{{ confirming }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ restart }}" style="height:44px;padding:0 12px;font-size:14px;font-weight:600;color:#1B4332;text-decoration:underline;text-underline-offset:3px">Choisir un autre code</button>
      </sc-if>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px">
    <sc-for list="{{ keys }}" as="k" hint-placeholder-count="11">
      <sc-if value="{{ k.btn }}" hint-placeholder-val="{{ true }}">
        <button type="button" aria-label="{{ k.aria }}" onClick="{{ k.tap }}" style="grid-column:{{ k.col }};height:64px;border-radius:20px;background:#F2F2EF;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center" style-active="background:#E0E0DA">
          <sc-if value="{{ k.txt }}" hint-placeholder-val="{{ true }}">{{ k.label }}</sc-if>
          <sc-if value="{{ k.del }}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5h10a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9L3 12l6-6.5ZM12 9.5l5 5M17 9.5l-5 5"></path></svg></sc-if>
        </button>
      </sc-if>
      <sc-if value="{{ k.go }}" hint-placeholder-val="{{ false }}">
        <a href="A7-Biometrie.dc.html" data-go="1" aria-label="{{ k.aria }}" style="grid-column:{{ k.col }};height:64px;border-radius:20px;background:#F2F2EF;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center" style-active="background:#E0E0DA">{{ k.label }}</a>
      </sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demo":{"editor":"enum","options":["","erreur"],"default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // demo "erreur" : l'écran s'ouvre sur une confirmation ratée (premier code : 1234).
    this.state = props.demo === "erreur" ? { phase: "confirm", pin1: "1234", cur: "", err: true } : { phase: "create", pin1: "", cur: "", err: false };
  }
  renderVals() {
    const s = this.state, confirming = s.phase === "confirm";
    // La 4e touche qui confirme le bon code est un lien : elle ouvre l'écran suivant.
    const goDigit = confirming && s.cur.length === 3 && s.pin1.slice(0, 3) === s.cur ? s.pin1[3] : null;
    const tap = (d) => {
      const cur = s.cur + d;
      if (cur.length < 4) return this.setState({ cur: cur, err: false });
      if (!confirming) return this.setState({ phase: "confirm", pin1: cur, cur: "", err: false });
      this.setState({ cur: "", err: true });
    };
    const del = () => this.setState({ cur: s.cur.slice(0, -1), err: false });
    const key = (d, col) => ({ label: d, aria: d, txt: true, del: false, col: col, btn: d !== goDigit, go: d === goDigit, tap: () => tap(d) });
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9"].map((d) => key(d, "auto"));
    keys.push(key("0", "span 2"));
    keys.push({ label: "", aria: "Effacer", txt: false, del: true, col: "auto", btn: true, go: false, tap: del });
    const dots = [0, 1, 2, 3].map((i) => {
      if (s.err) return { bg: "#C1121F", bd: "#C1121F" };
      return i < s.cur.length ? { bg: "#1B4332", bd: "#1B4332" } : { bg: "transparent", bd: "#9A9A94" };
    });
    return {
      title: confirming ? "Confirme ton code secret" : "Crée ton code secret",
      sub: confirming ? "Saisis-le une deuxième fois pour être sûr." : "4 chiffres. Il ouvre Boutik et protège tes cahiers.",
      calm: !s.err, err: s.err, confirming: confirming,
      tileBg: s.err ? "rgba(193,18,31,.1)" : "#1B4332", tileFg: s.err ? "#A50F1A" : "#fff",
      dots: dots, shake: s.err ? "bk-shake .4s ease" : "none",
      dotsAria: s.err ? "Code secret, à ressaisir" : "Code secret, " + s.cur.length + " chiffres saisis sur 4",
      keys: keys,
      restart: () => this.setState({ phase: "create", pin1: "", cur: "", err: false }),
      onKey: (e) => {
        if (e.key === "Backspace") return del();
        if (!/^\d$/.test(e.key)) return;
        if (e.key === goDigit) { const a = e.currentTarget.querySelector("a[data-go]"); if (a) a.click(); return; }
        tap(e.key);
      }
    };
  }
}
</script>
</body>
</html>
