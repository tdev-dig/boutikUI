<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Empreinte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#1B4332;font-family:Inter,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;padding:40px 20px 28px;display:flex;flex-direction:column;justify-content:space-between">

  <div style="display:flex;justify-content:center;height:44px;align-items:center">
    <div style="padding:7px 14px;border-radius:100px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600">Étape 4 sur 4</div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center">
    <div aria-hidden="true" style="width:128px;height:128px;border-radius:100px;background:#FAFAF7;color:#1B4332;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(255,255,255,.08),0 0 0 30px rgba(255,255,255,.04)">
      <svg width="64" height="64" viewBox="0 0 24 24" style="stroke-width:1.5"><path d="M12 10.5v4M8.7 19.5c.5-1.6.8-3.3.8-5V11a2.5 2.5 0 0 1 5 0v3c0 2.2-.3 4.2-1 6M5.5 16.5c.3-1.2.5-2.8.5-5a6 6 0 0 1 12 0c0 1.700 0 3.200-.3 4.500M7.500 6.200A7.500 7.500 0 0 1 16.500 6.200"></path></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
      <div style="font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15;max-width:320px">Rouvrir Boutik avec ton empreinte ?</div>
      <div style="font-size:15px;line-height:1.45;color:rgba(255,255,255,.82);max-width:310px">Plus besoin de saisir ton code à chaque ouverture. Tu peux changer d'avis dans ton profil.</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <a href="{{ next }}" style="height:56px;border-radius:18px;background:#FAFAF7;color:#0F2A20;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700">Activer l'empreinte</a>
    <a href="{{ next }}" style="height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.88)">Plus tard</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Rôle choisi au début (même onglet) ; sans lui, on ouvre l'inscription du boutiquier.
    let role = "";
    try { const o = window.name ? JSON.parse(window.name) : {}; role = (o && o.bkRole) || ""; } catch (err) {}
    return { next: role === "client" ? "O3-Client.dc.html" : "O1-Boutique.dc.html" };
  }
}
</script>
</body>
</html>
