<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cahier · fiche (carte retournée)</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#FAFAF7;font-family:Inter,system-ui,sans-serif;color:#1A1A1A;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased">

  <div style="background:#1B4332;border-radius:0 0 32px 32px;padding:40px 20px 14px;color:#fff;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <div style="font-size:26px;font-weight:700;letter-spacing:-.025em">Cahiers</div>
      <a href="B10-Tous-les-cahiers.dc.html" aria-label="Rechercher dans tous les cahiers" style="width:44px;height:44px;border-radius:100px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center">
        <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"></path></svg>
      </a>
    </div>

    <div style="position:relative;height:226px">
      <div aria-hidden="true" style="position:absolute;top:0;left:26px;right:26px;height:60px;border-radius:20px 20px 0 0;background:#2D6A4F"></div>
      <div aria-hidden="true" style="position:absolute;top:11px;left:13px;right:13px;height:60px;border-radius:21px 21px 0 0;background:#235540"></div>
      <a href="B3-Cahiers.dc.html" aria-label="Retourner la carte, côté montant" style="position:absolute;top:22px;left:0;right:0;height:204px;box-sizing:border-box;border-radius:22px;background:#0F2A20;border:1px solid rgba(255,255,255,.12);color:#fff;padding:5px 20px 2px;display:flex;flex-direction:column;box-shadow:0 14px 28px rgba(6,22,16,.34)">
        <div style="height:40px;display:flex;justify-content:space-between;align-items:center;gap:8px">
          <div style="font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)">Fiche du cahier n° 014</div>
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" style="color:#F4A100"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v4h-4M20 12a8 8 0 0 1-14 5.3M4 20v-4h4"></path></svg>
        </div>
        <div style="height:31px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:12.5px;color:rgba(255,255,255,.72)">Titulaire</span><span style="font-size:14px;font-weight:700">Aïssatou Diop</span></div>
        <div style="height:31px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:12.5px;color:rgba(255,255,255,.72)">Identité</span><span style="font-size:14px;font-weight:600">CNI vérifiée</span></div>
        <div style="height:31px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:12.5px;color:rgba(255,255,255,.72)">Téléphone</span><span style="font-size:14px;font-weight:600">77 512 00 00</span></div>
        <div style="height:31px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:12.5px;color:rgba(255,255,255,.72)">Ouvert le</span><span style="font-size:14px;font-weight:600">14 mars 2026</span></div>
        <div style="height:31px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;gap:10px"><span style="font-size:12.5px;color:rgba(255,255,255,.72)">Famille</span><span style="font-size:14px;font-weight:600">3 personnes</span></div>
      </a>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <button type="button" aria-label="Cahier précédent" disabled style="width:44px;height:44px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4)">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <div style="display:flex;align-items:center;gap:10px">
        <div aria-hidden="true" style="display:flex;gap:5px;align-items:center">
          <span style="width:18px;height:6px;border-radius:100px;background:#FAFAF7"></span>
          <span style="width:6px;height:6px;border-radius:100px;background:rgba(255,255,255,.4)"></span>
          <span style="width:6px;height:6px;border-radius:100px;background:rgba(255,255,255,.4)"></span>
          <span style="width:6px;height:6px;border-radius:100px;background:rgba(255,255,255,.4)"></span>
        </div>
        <div style="font-size:12.5px;color:rgba(255,255,255,.78)">1 sur 14</div>
      </div>
      <a href="B6-Cahier-bloque.dc.html" aria-label="Cahier suivant" style="width:44px;height:44px;border-radius:100px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </div>
  </div>

  <div style="padding:12px 20px 0;display:flex;flex-direction:column">
    <div style="font-size:16px;font-weight:700;letter-spacing:-.01em;height:36px;display:flex;align-items:center">Réglages du cahier</div>

    <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:12px;height:66px;border-top:1px solid rgba(27,67,50,.09)">
        <div style="flex-grow:1;min-width:0">
          <div style="font-size:15px;font-weight:600">{{ o.label }}</div>
          <div style="font-size:12.5px;color:#5F5F5A;margin-top:2px">{{ o.sub }}</div>
        </div>
        <button type="button" role="switch" aria-checked="{{ o.on }}" aria-label="{{ o.label }}" onClick="{{ o.toggle }}" style="width:52px;height:44px;display:flex;align-items:center;justify-content:center;flex:none"><span style="width:50px;height:30px;border-radius:100px;background:{{ o.bg }};display:flex;align-items:center;justify-content:{{ o.pos }};padding:3px;box-sizing:border-box;transition:background .15s"><span style="width:24px;height:24px;border-radius:100px;background:#fff"></span></span></button>
      </div>
    </sc-for>

    <sc-if value="{{ calm }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ arm }}" style="margin-top:10px;height:52px;border-radius:18px;border:1.5px solid rgba(193,18,31,.35);color:#C1121F;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px">Clôturer le cahier</button>
    </sc-if>
    <sc-if value="{{ armed }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:10px;display:flex;gap:8px">
        <button type="button" onClick="{{ disarm }}" style="flex:1;height:52px;border-radius:18px;border:1.5px solid rgba(27,67,50,.22);box-sizing:border-box;color:#1B4332;font-size:15px;font-weight:700">Annuler</button>
        <a href="B10-Tous-les-cahiers.dc.html" style="flex:1.4;height:52px;border-radius:18px;background:#C1121F;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center">Oui, clôturer</a>
      </div>
    </sc-if>
    <div style="font-size:12.5px;line-height:1.4;color:#5F5F5A;text-align:center;margin-top:8px">Le cahier sort de la pile. Ses bons restent dans l'historique.</div>
  </div>

  <div style="position:absolute;left:20px;right:20px;bottom:22px;display:flex;align-items:center;gap:10px">
    <nav aria-label="Menu principal" style="flex-grow:1;height:62px;box-sizing:border-box;padding:6px;border-radius:100px;background:#0F2A20;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 26px rgba(15,42,32,.28)">
      <a href="Main.dc.html" aria-label="Accueil" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"></path></svg>
      </a>
      <a href="B2-Vendeurs.dc.html" aria-label="Vendeurs" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM2.5 20c.5-3.4 3-5.5 6.5-5.5s6 2.1 6.5 5.5M16.5 4.4a3.5 3.5 0 0 1 0 6.2M18 14.9c2 .7 3.2 2.4 3.5 5.1"></path></svg>
      </a>
      <a href="B3-Cahiers.dc.html" aria-current="page" style="height:50px;padding:0 14px 0 12px;border-radius:100px;background:#FAFAF7;color:#0F2A20;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h15A1.5 1.5 0 0 1 21 11v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19v-8a1.5 1.5 0 0 1 1.5-1.5ZM5.5 6.5h13M8 3.5h8"></path></svg>Cahiers
      </a>
      <a href="B4-Profil.dc.html" aria-label="Profil" style="width:48px;height:50px;border-radius:100px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.82)">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20.5c.8-3.9 3.6-6 7.5-6s6.7 2.1 7.5 6"></path></svg>
      </a>
    </nav>
    <a href="F1-Camera.dc.html" aria-label="Noter un bon" style="width:62px;height:62px;border-radius:100px;background:#F4A100;color:#0F2A20;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 12px 24px rgba(244,161,0,.34)">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12V21l-3-1.8-3 1.8-3-1.8L6 21V3.5ZM12 8v6M9 11h6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { partiel: true, famille: true, avertir: false, armed: false }; }
  renderVals() {
    const s = this.state;
    const opt = (id, label, onTxt, offTxt) => ({ label: label, sub: s[id] ? onTxt : offTxt, on: s[id], toggle: () => this.setState({ [id]: !s[id] }), bg: s[id] ? "#2D6A4F" : "#C9C9C2", pos: s[id] ? "flex-end" : "flex-start" });
    return {
      opts: [
        opt("partiel", "Remboursement partiel", "Elle peut payer en plusieurs fois", "Elle doit tout payer en une fois"),
        opt("famille", "Bons de la famille", "Moussa et Khady peuvent noter des bons", "Seule Aïssatou peut noter des bons"),
        opt("avertir", "M'avertir à chaque bon", "Notification simple, rien à valider", "Aucune notification pour ce cahier")
      ],
      armed: s.armed, calm: !s.armed, arm: () => this.setState({ armed: true }), disarm: () => this.setState({ armed: false })
    };
  }
}
</script>
</body>
</html>
